<main>

  <noscript><p>This explainer needs JavaScript. Transcript:</p><p>A passenger jet weighs about 78 tons.</p><p>So how does all that weight leave the ground?</p><p>Four forces act on the plane.</p><p>Weight pulls it down. Thrust pushes it forward.</p><p>Drag holds it back. And lift pushes it up.</p><p>The engines suck in air and blast it out the back.</p><p>Push air backwards, and the plane is pushed forwards.</p><p>It speeds up, faster and faster, down the runway.</p><p>Now cut the wing open, and look at its shape.</p><p>It's curved on top, and tilted slightly upward.</p><p>Air flowing over the curved top speeds up, and its pressure drops.</p><p>The wing also pushes the air below it downward.</p><p>Lower pressure above, air pushed down below. Together, they push the wing up.</p><p>That upward push is lift.</p><p>Lift grows with the square of speed (lift ∝ v²).</p><p>Double the speed → 4× the lift.</p><p>That's why a plane needs a long runway to build up speed.</p><p>At about 270 km/h, lift becomes bigger than weight.</p><p>The pilot pulls back, and the nose tilts up.</p><p>The wheels leave the runway, and the plane climbs away.</p><p>Engines make speed. Wings turn speed into lift.</p><p>That's how a plane takes off.</p></noscript>

    const RATES = [0.75, 1, 1.25, 1.5]; const rateBtn = $('[data-rate]'); const setRate = (r) => { S.rate = r; rateBtn.textContent = r + '×'; A.files.forEach((a) => (a.playbackRate = r)); savePrefs(); }; setRate(S.rate);

      trEl.querySelectorAll('p').forEach((p) => { const go = () => { seek(parseFloat(p.dataset.t)); if (!S.playing) render(S.t); }; p.onclick = go; p.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; }); }

    const vttT = (s) => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = (s % 60).toFixed(3); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${r.padStart(6, '0')}`; };

    }
